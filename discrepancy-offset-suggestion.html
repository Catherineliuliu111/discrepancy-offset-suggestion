<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offset Suggestions for Discrepancies</title>
  <style>
    :root {
      --primary: #1890ff;
      --text: rgba(0, 0, 0, 0.85);
      --muted: rgba(0, 0, 0, 0.45);
      --page: #d9d9d9;
      --header: #f5f5f5;
      --line: #f0f0f0;
      --blue-bg: #e6f7ff;
      --blue-line: #91d5ff;
      --pink: #ff4fa3;
      --pink-bg: #fff0f6;
      --pink-line: #ffadd2;
      --green: #52c41a;
      --green-bg: #f6ffed;
      --green-line: #b7eb8f;
      --red: #cf1322;
      --red-bg: #fff1f0;
      --orange: #faad14;
      --orange-bg: #fffbe6;
      --orange-line: #ffd666;
      --purple: #722ed1;
      --purple-bg: #f9f0ff;
      --purple-line: #d3adf7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      background: var(--page);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    select,
    input[type="checkbox"] {
      cursor: pointer;
    }

    .page {
      width: 100vw;
      height: 100vh;
      padding: 10px;
    }

    .shell {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: calc(100vh - 24px);
      border-radius: 4px;
      background: #fff;
    }

    .tabs-nav {
      display: flex;
      align-items: flex-end;
      flex: 0 0 38px;
      min-height: 38px;
      border-bottom: 1px solid #e8e8e8;
      background: #f5f5f5;
    }

    .tab-link,
    .tab-current {
      display: inline-flex;
      align-items: center;
      height: 32px;
      margin: 0 0 0 10px;
      padding: 0 12px;
      border: 1px solid #d9d9d9;
      border-bottom: 0;
      border-radius: 4px 4px 0 0;
      background: #fff;
      color: rgba(0, 0, 0, 0.65);
      font-size: 12px;
      line-height: 32px;
      text-decoration: none;
      white-space: nowrap;
    }

    .tab-link:hover {
      color: var(--primary);
    }

    .tab-current {
      color: var(--primary);
      font-weight: 700;
    }

    .tab-rest {
      align-self: stretch;
      flex: 1 1 auto;
      border-bottom: 1px solid transparent;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex: 0 0 70px;
      min-height: 70px;
      padding: 10px 22px 11px;
      border-bottom: 1px solid #edf0f5;
      background: linear-gradient(180deg, #ffffff 0%, #f7fbff 100%);
    }

    .title-block {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .title-copy {
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: 4px;
    }

    h1 {
      margin: 0;
      color: rgba(0, 0, 0, 0.86);
      font-size: 26px;
      font-weight: 700;
      line-height: 32px;
      white-space: nowrap;
    }

    .title-subtitle {
      color: rgba(0, 0, 0, 0.56);
      font-size: 12px;
      line-height: 18px;
      white-space: nowrap;
    }

    .title-count {
      color: var(--primary);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn {
      height: 32px;
      padding: 0 14px;
      border: 1px solid #d9d9d9;
      border-radius: 2px;
      color: var(--text);
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn.primary {
      color: #fff;
      border-color: var(--primary);
      background: var(--primary);
    }

    .btn.confirm {
      color: #fff;
      border-color: var(--green);
      background: var(--green);
    }

    .btn.warning {
      color: #fff;
      border-color: var(--orange);
      background: var(--orange);
    }

    .filters {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      flex: 0 0 auto;
      gap: 8px;
      padding: 14px 18px 10px;
      background: #fff;
      overflow-x: auto;
    }

    .field {
      display: inline-flex;
      align-items: center;
      height: 32px;
      min-width: 160px;
      border-radius: 6px;
      background: #f5f6f7;
      white-space: nowrap;
      overflow: hidden;
    }

    .field.field-date {
      min-width: 300px;
    }

    .field.field-reference {
      min-width: 220px;
    }

    .field.field-discrepancy {
      min-width: 190px;
    }

    .filter-prefix {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex: 0 0 auto;
      height: 32px;
      min-width: 130px;
      padding: 0 12px;
      color: rgba(0, 0, 0, 0.72);
      background: #f2f3f5;
    }

    .filter-caret,
    .filter-calendar,
    .filter-plus {
      color: rgba(0, 0, 0, 0.35);
    }

    .filter-input,
    .field select {
      min-width: 0;
      height: 32px;
      border: 0;
      color: rgba(0, 0, 0, 0.72);
      background: transparent;
      outline: 0;
    }

    .field select {
      width: 100%;
      padding: 0 28px 0 12px;
    }

    .filter-input {
      flex: 1 1 auto;
      padding: 0 12px;
    }

    .date-value {
      padding: 0 12px;
      color: rgba(0, 0, 0, 0.78);
    }

    .date-arrow {
      color: rgba(0, 0, 0, 0.35);
    }

    .filter-plus {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 38px;
      height: 32px;
      border-left: 1px solid #ececec;
      font-size: 18px;
    }

    .filter-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      height: 32px;
      min-width: 48px;
      padding: 0 12px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      color: rgba(0, 0, 0, 0.78);
      background: #fff;
      white-space: nowrap;
    }

    .refresh-btn {
      min-width: 72px;
      border-color: var(--primary);
      color: var(--primary);
      background: #fff;
    }

    .refresh-btn:disabled {
      cursor: not-allowed;
      border-color: #d9d9d9;
      color: rgba(0, 0, 0, 0.35);
      background: #f5f5f5;
    }

    .filter-icon-btn {
      min-width: 34px;
      padding: 0;
    }

    .summary-bar {
      display: flex;
      align-items: center;
      flex: 0 0 36px;
      gap: 10px;
      min-height: 36px;
      padding: 0 28px 8px;
      border-bottom: 1px solid #e8e8e8;
      background: #fff;
      color: rgba(0, 0, 0, 0.65);
    }

    .summary-spacer {
      flex: 1 1 auto;
    }

    .latest-update {
      color: rgba(0, 0, 0, 0.45);
      font-size: 12px;
      line-height: 18px;
      white-space: nowrap;
    }

    .latest-update strong {
      color: rgba(0, 0, 0, 0.62);
      font-weight: 600;
    }

    .summary-title {
      color: var(--primary);
      font-weight: 700;
    }

    .count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 20px;
      padding: 0 7px;
      border-radius: 10px;
      color: var(--primary);
      background: var(--blue-bg);
      font-size: 12px;
      font-weight: 700;
    }

    .table-card {
      flex: 1 1 auto;
      min-height: 0;
      padding: 10px 18px 12px;
      border-radius: 20px;
      background: #fff;
    }

    .table-scroll {
      overflow: auto;
      width: 100%;
      height: 100%;
      border-radius: 2px;
    }

    .results {
      width: 2240px;
      min-width: 2240px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    th {
      height: 36px;
      padding: 5px 7px;
      color: rgba(0, 0, 0, 0.72);
      background: #fafafa;
      font-size: 12px;
      font-weight: 700;
      line-height: 16px;
      white-space: normal;
    }

    th.left-order,
    td.left-order {
      background: #f7fbff;
    }

    th.right-order,
    td.right-order {
      background: #fffaf2;
    }

    th.left-order.first-group,
    td.left-order.first-group {
      border-left: 3px solid #91d5ff;
    }

    th.right-order.first-group,
    td.right-order.first-group {
      border-left: 3px solid #ffd591;
    }

    th.left-order.last-group,
    td.left-order.last-group {
      border-right: 1px solid #c9e6ff;
    }

    th.right-order.last-group,
    td.right-order.last-group {
      border-right: 1px solid #ffe2b8;
    }

    th.operation-cell,
    td.operation-cell {
      background: #f9f0ff;
      border-left: 2px solid #d3adf7;
      border-right: 2px solid #d3adf7;
      text-align: center;
    }

    th.matching-rule-cell,
    td.matching-rule-cell {
      background: #fbfffa;
      border-left: 2px solid #d9f7be;
    }

    td {
      height: 36px;
      padding: 5px 7px;
      color: rgba(0, 0, 0, 0.76);
      background: #fff;
      line-height: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    td.matching-rule-cell {
      overflow: visible;
      white-space: normal;
    }

    tr.confirmed td {
      background: #fcfffa;
    }

    .results tbody tr:hover td.left-order {
      background: #eef8ff;
    }

    .results tbody tr:hover td.right-order {
      background: #fff3df;
    }

    .results tbody tr:hover td.operation-cell {
      background: #efdbff;
    }

    .check-cell,
    .arrow-cell {
      text-align: center;
    }

    .row-check {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }

    .match-bridge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-width: 0;
    }

    .offset-bridge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .offset-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 82px;
      height: 26px;
      padding: 0 12px;
      border: 1px solid #722ed1;
      border-radius: 999px;
      color: #fff;
      background: #722ed1;
      box-shadow: 0 2px 6px rgba(114, 46, 209, 0.22);
      font-size: 12px;
      font-weight: 700;
      line-height: 24px;
      white-space: nowrap;
    }

    .offset-bridge::before,
    .offset-bridge::after {
      content: none;
    }

    .offset-icon,
    .offset-head-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 56px;
      height: 26px;
      color: #1677ff;
    }

    .offset-head-icon {
      max-width: 44px;
      height: 22px;
      margin: 0 auto;
    }

    .offset-icon svg,
    .offset-head-icon svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      shape-rendering: geometricPrecision;
    }

    @media (max-width: 900px) {
      th {
        padding: 5px 4px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 10px;
      }

      td {
        padding: 5px 4px;
        font-size: 10px;
      }

      .tag {
        max-width: 56px;
        padding: 0 5px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }

    .link,
    .details-link {
      color: var(--primary);
      font-weight: 500;
      text-decoration: none;
    }

    .link:hover,
    .details-link:hover {
      text-decoration: underline;
    }

    .ref {
      color: #000000;
      font-weight: 500;
    }

    .amount-value {
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    .system-code {
      color: rgba(0, 0, 0, 0.72);
      font-weight: 500;
    }

    .source-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      color: var(--primary);
      vertical-align: middle;
    }

    .source-status svg {
      display: block;
      width: 16px;
      height: 16px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 20px;
      padding: 0 5px;
      border: 1px solid transparent;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
      line-height: 18px;
      white-space: nowrap;
    }

    .tag.over {
      color: var(--pink);
      border-color: var(--pink-line);
      background: var(--pink-bg);
    }

    .tag.less {
      color: var(--primary);
      border-color: var(--blue-line);
      background: var(--blue-bg);
    }

    .tag.success {
      color: #237804;
      border-color: var(--green-line);
      background: var(--green-bg);
    }

    .tag.in {
      color: #237804;
      background: #d9f7be;
    }

    .tag.out {
      color: var(--red);
      background: var(--red-bg);
    }

    .tag.reason {
      color: var(--green);
      border-color: var(--green-line);
      background: var(--green-bg);
      font-size: 10px;
    }

    .tag.reason-pink {
      color: var(--pink);
      border-color: var(--pink-line);
      background: var(--pink-bg);
      font-size: 10px;
    }

    .tag.reason-alert {
      color: var(--red);
      border-color: #ffccc7;
      background: var(--red-bg);
      font-size: 10px;
    }

    .tag.action-offset {
      color: var(--purple);
      border-color: var(--purple-line);
      background: var(--purple-bg);
    }

    .tag.action-success {
      color: #237804;
      border-color: var(--green-line);
      background: var(--green-bg);
    }

    .reason-list {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 4px;
      overflow: visible;
      white-space: nowrap;
    }

    .biz-text {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.35);
      z-index: 50;
    }

    .modal-mask.show {
      display: flex;
    }

    .modal {
      width: 420px;
      border-radius: 4px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .modal-head {
      padding: 18px 20px 10px;
      color: var(--text);
      font-size: 18px;
      font-weight: 700;
    }

    .modal-body {
      padding: 0 20px 18px;
      color: rgba(0, 0, 0, 0.65);
      line-height: 22px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 10px 20px 18px;
    }

    .toast {
      position: fixed;
      right: 24px;
      top: 24px;
      display: none;
      min-width: 220px;
      padding: 10px 14px;
      border: 1px solid var(--green-line);
      border-radius: 4px;
      color: #237804;
      background: var(--green-bg);
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
      z-index: 60;
    }

    .toast.show {
      display: block;
    }

    .offset-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 18px;
      padding: 12px 16px;
      border: 1px solid var(--blue-line);
      border-radius: 6px;
      background: var(--blue-bg);
      color: rgba(0, 0, 0, 0.72);
      font-size: 13px;
      line-height: 1.5;
    }

    .offset-banner .banner-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 28px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
    }

    .offset-banner .banner-text {
      flex: 1 1 auto;
    }

    .offset-banner .banner-text strong {
      color: var(--primary);
    }

    .help-tip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      line-height: 15px;
      cursor: help;
      margin-left: 4px;
      position: relative;
    }

    .help-tip:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 10px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.82);
      color: #fff;
      font-size: 11px;
      line-height: 1.4;
      white-space: nowrap;
      z-index: 20;
      pointer-events: none;
    }

    .field-date.disabled {
      opacity: 0.7;
      cursor: not-allowed;
      background: #f0f0f0;
    }

    .field-date.disabled .date-value {
      color: rgba(0, 0, 0, 0.45);
    }

    .field-date.disabled .filter-calendar {
      color: rgba(0, 0, 0, 0.25);
    }

    .field-date.disabled:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      font-size: 11px;
      white-space: nowrap;
      z-index: 10;
      pointer-events: none;
    }

    .field-date {
      position: relative;
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="shell">
      <div class="tabs-nav">
        <a class="tab-link" href="./sop-guideline-replica.html?from=discrepancy-offset-suggestion">Reconciliation To-Do List</a>
        <a class="tab-link" href="./discrepancy-details-v2-manual-refund-update.html?from=discrepancy-offset-suggestion">Discrepancy Details</a>
        <div class="tab-current">Offset Suggestions for Discrepancies</div>
        <div class="tab-rest"></div>
      </div>
      <header class="topbar">
        <div class="title-block">
          <div class="title-copy">
            <h1>Offset Suggestions for Discrepancies</h1>
          </div>
        </div>
        <div class="actions">
          <button class="btn warning" type="button">Decline Suggestion</button>
          <button class="btn confirm" type="button" id="confirmSuggestBtn">Confirm Suggestion</button>
        </div>
      </header>

      <div class="filters">
        <div class="field field-date disabled" data-tooltip="The suggestion pool only queries data with Clearing Date within two weeks of the system date.">
          <span class="filter-prefix">Clearing Date <span class="filter-caret">⌄</span> <span class="help-tip" data-tooltip="the system filters Discrepancy Order data from the past 14 days to generate offset matching suggestions by default.">?</span></span>
          <span class="date-value" id="clearingDateFrom"></span>
          <span class="date-arrow">→</span>
          <span class="date-value" id="clearingDateTo"></span>
          <span class="filter-calendar">▣</span>
        </div>
        <div class="field">
          <select class="select-agreement" id="agreementItem">
            <option value="">Agreement Item</option>
            <option>Alto-ShopeePay-0918-Payout-AS</option>
            <option>SPM MY - Wallet</option>
            <option>SPM MY - Bank</option>
          </select>
        </div>
        <div class="field">
          <select class="select-short" id="offsetType">
            <option value="">Offset Type</option>
            <option value="over-less">Over TXN VS Less TXN</option>
            <option value="over-over">Over Payment &amp; Refund</option>
            <option value="less-less">Less Payment &amp; Refund</option>
          </select>
        </div>
        <div class="field field-reference">
          <input class="filter-input" id="discrepancyOrderInput" placeholder="Discrepancy Order ID" />
          <span class="filter-plus" id="addDiscrepancyOrder">+</span>
        </div>
        <div class="field field-reference">
          <input class="filter-input" id="referenceInput" placeholder="Reference ID" />
          <span class="filter-plus" id="addReference">+</span>
        </div>
        <button class="filter-btn" type="button" id="searchBtn">Search</button>
        <button class="filter-btn refresh-btn" type="button" id="refreshBtn">Refresh</button>
      </div>

      <div class="summary-bar">
        <span class="summary-title" id="summaryTitle">Offset Matching</span>
        <span class="count" id="summaryCount">18</span>
        <span class="summary-spacer"></span>
        <span class="latest-update">Latest update time: <strong id="latestUpdateTime">-</strong></span>
      </div>

      <section class="table-card">
        <div class="table-scroll">
          <table class="results" id="resultsTable">
            <colgroup id="colGroup"></colgroup>
            <thead>
              <tr id="headerRow"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </section>
  </div>

  <div class="modal-mask" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal">
      <div class="modal-head" id="confirmTitle">Confirm Suggestion</div>
      <div class="modal-body" id="confirmMessage"></div>
      <div class="modal-actions">
        <button class="btn" type="button" id="cancelConfirm">Cancel</button>
        <button class="btn confirm" type="button" id="applyConfirm">Confirm</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast">Suggest action confirmed.</div>

  <script>
    const columns = {
      offset: [
        ["", 42, "left-order first-group"], ["Discrepancy Order ID", 142, "left-order"], ["Clearing Date", 110, "left-order"],
        ["Agreement Item", 180, "left-order"], ["Discrepancy Type", 110, "left-order"], ["Fund Direction", 108, "left-order"],
        ["Reference ID", 138, "left-order"], ["Amount", 96, "left-order last-group"],
        ["", 82, "operation-cell"],
        ["Discrepancy Order ID", 142, "right-order first-group"], ["Clearing Date", 110, "right-order"],
        ["Agreement Item", 180, "right-order"], ["Discrepancy Type", 110, "right-order"], ["Fund Direction", 108, "right-order"],
        ["Reference ID", 138, "right-order"], ["Amount", 96, "right-order last-group"], ["Matching Reason", 400, "matching-rule-cell"]
      ]
    };

    const configs = {
      offset: {
        action: "Offset",
        title: "Offset Matching",
        count: "12",
        leftType: "Over TXN",
        rightType: "Less TXN",
        columnSet: "offset",
        rows: 18
      }
    };

    let currentAction = "offset";
    const confirmedRows = new Set();

    const typeTag = (value) => {
      if (value === "Payment Success") return '<span class="tag success">Success</span>';
      return `<span class="tag ${value === "Over TXN" ? "over" : "less"}">${value}</span>`;
    };
    const fundTag = (value) => `<span class="tag ${value === "IN" ? "in" : "out"}">${value}</span>`;
    const matchingRuleTags = (row) => {
      const fundRule = row.sameTypeOffset ? "Opposite Fund Direction" : "Fund Direction";
      const matchReasonClass = row.matchReason === "Biz Info Fuzzy Matching" ? "reason-alert" : "reason";
      return `
        <div class="reason-list">
          <span class="tag reason">Agreement Item</span>
          <span class="tag reason">Amount</span>
          <span class="tag reason">${fundRule}</span>
          ${row.matchReason ? `<span class="tag ${matchReasonClass}">${row.matchReason}</span>` : ""}
          <span class="tag reason">CD Gap: ${row.matchingClearingDateGap}d</span>
        </div>
      `;
    };
    const amountSamples = ["RM34.87", "RM30.24", "RM504.51", "RM43.02", "RM115.82", "RM5.72", "RM401.67", "RM36.90"];
    const sourcePaymentIds = [
      "1030339300203960975",
      "1030865300202363466",
      "1031238300017751691",
      "1030469300203383788",
      "1030932300201867088",
      "1030116300206050006",
      "1030435300203525725",
      "1030765300201819856"
    ];
    const sourceStatusIcon = `
      <span class="source-status" role="img" aria-label="Source status synced" title="Source status synced">
        <svg viewBox="0 0 18 18" aria-hidden="true" focusable="false">
          <path d="M14.2 6.3A5.7 5.7 0 0 0 4 4.2L2.8 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M3 2.1v3.6h3.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M3.8 11.7A5.7 5.7 0 0 0 14 13.8l1.2-1.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M15 15.9v-3.6h-3.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
    `;

    const offsetTypeLabels = {
      "over-less": "Over TXN VS Less TXN",
      "over-over": "Over Payment & Refund",
      "less-less": "Less Payment & Refund"
    };

    const padDate = (value) => String(value).padStart(2, "0");
    const formatDate = (date) => `${date.getFullYear()}-${padDate(date.getMonth() + 1)}-${padDate(date.getDate())}`;

    const setClearingDateRange = () => {
      const now = new Date();
      const to = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const from = new Date(to);
      from.setDate(from.getDate() - 13);
      document.getElementById("clearingDateFrom").textContent = formatDate(from);
      document.getElementById("clearingDateTo").textContent = formatDate(to);
    };

    let submittedFilters = {
      agreement: "",
      offsetType: "",
      discrepancyOrderId: "",
      referenceId: ""
    };
    let rematchVersion = 0;
    let latestUpdateTime = new Date();

    const formatUpdateTime = (date) => {
      const pad = (value) => String(value).padStart(2, "0");
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
    };

    const generateClearingDates = (index, scenario) => {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const twoWeeksAgo = new Date(today);
      twoWeeksAgo.setDate(twoWeeksAgo.getDate() - 14);
      const isWithinWindow = index % 4 !== 0;
      const gap = scenario === "over-less" ? 3 : 7;
      const baseDate = isWithinWindow
        ? new Date(twoWeeksAgo.getTime() + Math.random() * (today.getTime() - twoWeeksAgo.getTime() - gap * 86400000))
        : new Date(twoWeeksAgo.getTime() - (1 + Math.random() * 3) * 86400000);
      const leftDate = new Date(baseDate);
      const rightDate = new Date(baseDate);
      rightDate.setDate(rightDate.getDate() + gap);
      return {
        leftClearingDate: formatDate(leftDate),
        rightClearingDate: formatDate(rightDate),
        matchingClearingDateGap: gap
      };
    };

    const makeAllRows = (config) => Array.from({ length: config.rows }, (_, index) => {
      const scenario = index % 3 === 1 ? "over-over" : index % 3 === 2 ? "less-less" : "over-less";
      const sameTypeOffset = scenario !== "over-less";
      const leftFund = index % 2 === 0 ? "IN" : "OUT";
      const rightFund = sameTypeOffset ? (leftFund === "IN" ? "OUT" : "IN") : leftFund;
      const variantIndex = index + rematchVersion;
      const amount = amountSamples[variantIndex % amountSamples.length];
      const leftRef = index >= 4 ? ["AX4UR58WAW9W", "AX4UR58VY4C2", "AX4UEDUOVDAA"][variantIndex % 3] : `AX4U1M${29 + variantIndex}K29DW`;
      const rightRef = variantIndex % 5 === 0 ? `RFND${20260600 + variantIndex}` : leftRef;
      const matchReason = sameTypeOffset ? "" : (variantIndex % 4 === 3 ? "Biz Info Fuzzy Matching" : "Reference ID");
      const leftType = scenario === "less-less" ? "Less TXN" : "Over TXN";
      const rightType = scenario === "over-over" ? "Over TXN" : "Less TXN";
      const agreement = index % 4 === 1 ? "SPM MY - Wallet" : index % 4 === 2 ? "SPM MY - Bank" : "Alto-ShopeePay-0918-Payout-AS";
      const { leftClearingDate, rightClearingDate, matchingClearingDateGap } = generateClearingDates(index, scenario);
      return {
        checked: index === 0,
        key: `${currentAction}-${index}`,
        leftId: `104...${98406967 + index}`,
        rightId: `104...${99791566 + index}`,
        agreement,
        offsetType: scenario,
        leftType,
        rightType,
        leftFund,
        rightFund,
        leftRef,
        rightRef,
        amount,
        matchReason,
        sameTypeOffset,
        systemCode: "SPM_INBOUND",
        sourcePaymentId: sourcePaymentIds[index % sourcePaymentIds.length],
        leftClearingDate,
        rightClearingDate,
        matchingClearingDateGap
      };
    });

    const filterRows = (rows) => rows.filter(row => {
      const agreementMatch = !submittedFilters.agreement || row.agreement === submittedFilters.agreement;
      const offsetTypeMatch = !submittedFilters.offsetType || row.offsetType === submittedFilters.offsetType;
      const referenceKeyword = submittedFilters.referenceId.toLowerCase();
      const referenceMatch = !referenceKeyword
        || row.leftRef.toLowerCase().includes(referenceKeyword)
        || row.rightRef.toLowerCase().includes(referenceKeyword);
      const orderKeyword = submittedFilters.discrepancyOrderId.toLowerCase();
      const orderMatch = !orderKeyword
        || row.leftId.toLowerCase().includes(orderKeyword)
        || row.rightId.toLowerCase().includes(orderKeyword);
      return agreementMatch && offsetTypeMatch && orderMatch && referenceMatch;
    });

    const submitFilters = () => {
      submittedFilters = {
        agreement: document.getElementById("agreementItem").value,
        offsetType: document.getElementById("offsetType").value,
        discrepancyOrderId: document.getElementById("discrepancyOrderInput").value.trim(),
        referenceId: document.getElementById("referenceInput").value.trim()
      };
      render();
      const typeLabel = submittedFilters.offsetType ? offsetTypeLabels[submittedFilters.offsetType] : "All Offset Types";
      toast.textContent = `Filter submitted: ${typeLabel}`;
      toast.classList.add("show");
      window.setTimeout(() => toast.classList.remove("show"), 1600);
    };

    const bridgeCell = () => `<td class="arrow-cell operation-cell"><div class="match-bridge"><span class="offset-bridge"><span class="offset-badge">Offset</span></span></div></td>`;

    const commonLeftCells = (row, config) => `
      <td class="check-cell left-order first-group"><input class="row-check" type="checkbox" data-row-key="${row.key}" ${row.checked ? "checked" : ""} /></td>
      <td class="left-order"><a class="link" href="#">${row.leftId}</a></td>
      <td class="left-order">${row.leftClearingDate}</td>
      <td class="left-order">${row.agreement}</td>
      <td class="left-order">${typeTag(row.leftType)}</td>
      <td class="left-order">${fundTag(row.leftFund)}</td>
      <td class="left-order"><span class="ref">${row.leftRef}</span></td>
      <td class="left-order last-group">${row.amount}</td>
      ${bridgeCell()}
    `;

    const renderOffsetRow = (row, config) => `
      <tr data-row-key="${row.key}" class="${confirmedRows.has(row.key) ? "confirmed" : ""}">
        ${commonLeftCells(row, config)}
        <td class="right-order first-group"><a class="link" href="#">${row.rightId}</a></td>
        <td class="right-order">${row.rightClearingDate}</td>
        <td class="right-order">${row.agreement}</td>
        <td class="right-order">${typeTag(row.rightType)}</td>
        <td class="right-order">${fundTag(row.rightFund)}</td>
        <td class="right-order"><span class="ref">${row.rightRef}</span></td>
        <td class="right-order last-group"><span class="amount-value">${row.amount}</span></td>
        <td class="matching-rule-cell" title="Agreement Item / Amount / ${row.sameTypeOffset ? "Opposite Fund Direction" : `Fund Direction / ${row.matchReason}`} / CD Gap: ${row.matchingClearingDateGap}d">${matchingRuleTags(row)}</td>
      </tr>
    `;

    const render = () => {
      const config = configs[currentAction];
      const activeColumns = columns[config.columnSet];
      document.getElementById("resultsTable").style.minWidth = "2422px";
      document.getElementById("colGroup").innerHTML = activeColumns.map(([, width]) => `<col style="width:${width}px" />`).join("");
      document.getElementById("headerRow").innerHTML = activeColumns.map(([label, , className]) => `<th class="${className || ""}">${label}</th>`).join("");
      document.getElementById("summaryTitle").textContent = config.title;
      const rows = filterRows(makeAllRows(config));
      document.getElementById("summaryCount").textContent = rows.length;
      document.getElementById("latestUpdateTime").textContent = formatUpdateTime(latestUpdateTime);

      document.getElementById("tableBody").innerHTML = rows
        .map((row) => {
          if (config.columnSet === "offset") return renderOffsetRow(row, config);
          return "";
        })
        .join("");
    };

    const selectedRows = () => Array.from(document.querySelectorAll(".row-check:checked")).map((input) => input.dataset.rowKey);

    ["agreementItem", "offsetType"].forEach((id) => {
      document.getElementById(id).addEventListener("change", submitFilters);
    });
    document.getElementById("searchBtn").addEventListener("click", submitFilters);
    document.getElementById("refreshBtn").addEventListener("click", () => {
      const refreshBtn = document.getElementById("refreshBtn");
      refreshBtn.disabled = true;
      refreshBtn.textContent = "Refreshing...";
      toast.textContent = "Rematching offset suggestions...";
      toast.classList.add("show");
      window.setTimeout(() => {
        rematchVersion += 1;
        latestUpdateTime = new Date();
    setClearingDateRange();
    render();
        refreshBtn.disabled = false;
        refreshBtn.textContent = "Refresh";
        toast.textContent = "Offset suggestions refreshed.";
        window.setTimeout(() => toast.classList.remove("show"), 1600);
      }, 650);
    });
    document.getElementById("discrepancyOrderInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") submitFilters();
    });
    document.getElementById("addDiscrepancyOrder").addEventListener("click", () => {
      const input = document.getElementById("discrepancyOrderInput");
      if (input.value.trim()) {
        submitFilters();
      }
    });
    document.getElementById("referenceInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") submitFilters();
    });
    document.getElementById("addReference").addEventListener("click", () => {
      const input = document.getElementById("referenceInput");
      if (input.value.trim()) {
        submitFilters();
      }
    });
    const modal = document.getElementById("confirmModal");
    const toast = document.getElementById("toast");
    document.getElementById("confirmSuggestBtn").addEventListener("click", () => {
      const keys = selectedRows();
      const config = configs[currentAction];
      document.getElementById("confirmMessage").textContent = keys.length
        ? `Confirm ${config.action} suggestion for ${keys.length} selected transaction(s)?`
        : "Please select at least one transaction before confirming.";
      document.getElementById("applyConfirm").style.display = keys.length ? "inline-block" : "none";
      modal.classList.add("show");
    });

    document.getElementById("cancelConfirm").addEventListener("click", () => {
      modal.classList.remove("show");
    });

    document.getElementById("applyConfirm").addEventListener("click", () => {
      selectedRows().forEach((key) => confirmedRows.add(key));
      modal.classList.remove("show");
      render();
      toast.classList.add("show");
      window.setTimeout(() => toast.classList.remove("show"), 1800);
    });

    const params = new URLSearchParams(window.location.search);
    const requestedAction = params.get("action");
    if (configs[requestedAction]) {
      currentAction = requestedAction;
    } else if (requestedAction) {
      const url = new URL(window.location.href);
      url.searchParams.set("action", currentAction);
      window.history.replaceState(null, "", url);
    }
    setClearingDateRange();
    render();
  </script>
</body>
</html>
